name: build_and_test

on:
  pull_request:
    branches:
      - master
      - mainnet-beta

defaults:
  run:
    working-directory: ./keep-rs

env:
  # `drift-rs`, `drift-ffi-sys` and the `drift` crate (protocol-v2) are
  # consumed as path-deps / build-deps on siblings of this repo (see
  # Cargo.toml and drift-rs build.rs). These refs pin which commits CI builds
  # against.
  DRIFT_RS_REF: main
  FFI_REF: master
  SHADOW_REF: main

jobs:
  build_and_test:
    runs-on: ubicloud
    container: rust:1.91.1
    timeout-minutes: 30
    strategy:
      matrix:
        task: ["build", "test"]
    steps:
      # Common steps
      - name: Checkout keep-rs
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: keep-rs

      - name: Checkout drift-rs
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ptn611/drift-rs
          ref: ${{ env.DRIFT_RS_REF }}
          path: drift-rs

      - name: Checkout drift-ffi-sys (sibling, built from source by drift-rs build.rs)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ptn611/drift-ffi-sys
          ref: ${{ env.FFI_REF }}
          path: drift-ffi-sys

      - name: Checkout protocol-v2 (drift crate dep)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ptn611/protocol-v2
          ref: ${{ env.SHADOW_REF }}
          path: protocol-v2

      - name: Install OS dependencies
        run: apt-get update && apt-get install -y git cmake jq

      - name: Install rustfmt and toolchain
        run: rustup component add rustfmt

      - name: Cache cargo index
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Fmt
        if: matrix.task == 'build'
        run: cargo fmt

      - name: Build
        if: matrix.task == 'build'
        run: cargo check
