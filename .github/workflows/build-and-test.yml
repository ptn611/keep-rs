name: build_and_test

on:
  pull_request:
    branches:
      - master
      - mainnet-beta

defaults:
  run:
    working-directory: ./keep-rs

env:
  CARGO_DRIFT_FFI_PATH: /usr/local/lib
  # `drift-rs` and the `drift` crate (protocol-v2-shadow) are consumed as path
  # deps on siblings of this repo (see Cargo.toml). These refs pin which
  # commits CI builds against.
  DRIFT_RS_REF: next
  SHADOW_REF: master

jobs:
  build_and_test:
    runs-on: ubicloud
    container: rust:1.87.0
    timeout-minutes: 10
    strategy:
      matrix:
        task: ["build", "test"]
    steps:
      # Common steps
      - name: Checkout keep-rs
        uses: actions/checkout@v4
        with:
          path: keep-rs

      - name: Checkout drift-rs
        uses: actions/checkout@v4
        with:
          repository: drift-labs/drift-rs
          ref: ${{ env.DRIFT_RS_REF }}
          path: drift-rs

      - name: Checkout protocol-v2-shadow
        uses: actions/checkout@v4
        with:
          repository: drift-labs/protocol-v2-shadow
          ref: ${{ env.SHADOW_REF }}
          token: ${{ secrets.GH_PAT }}
          path: protocol-v2-shadow

      - name: Install OS dependencies
        run: apt-get update && apt-get install -y git cmake jq

      - name: Install rustfmt and toolchain
        run: rustup component add rustfmt

      - name: Install libdrift_ffi
        run: |
          SO_URL=$(curl -s https://api.github.com/repos/drift-labs/drift-ffi-sys/releases/latest | jq -r '.assets[] | select(.name=="libdrift_ffi_sys.so") | .browser_download_url')
          echo "downloading libdrift: $SO_URL"
          curl -L -o libdrift_ffi_sys.so "$SO_URL"
          cp libdrift_ffi_sys.so $CARGO_DRIFT_FFI_PATH

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Fmt
        if: matrix.task == 'build'
        run: cargo fmt

      - name: Build
        if: matrix.task == 'build'
        run: cargo check
